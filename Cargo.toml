[package]
name = "yks-pusulasi"
version = "0.1.1"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlFormElement", "FormData", "SubmitEvent", "Event"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
